[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "malvexis"
version = "0.2.0"
description = "Malvexis - malware research and threat intelligence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pefile>=2023.2.7",
    "requests>=2.31",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
yara = ["yara-python>=4.3"]
ssdeep = ["ssdeep>=3.4"]
die = ["die-python>=0.5"]
capa = ["flare-capa>=9.0"]
floss = ["flare-floss>=3.0"]
tools = ["die-python>=0.5", "flare-capa>=9.0", "flare-floss>=3.0"]
dev = ["pytest>=8.0"]

[project.scripts]
malvexis = "malvexis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"malvexis.report" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
